name: Build Windows Installer

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name DevOpsTracker --icon app.ico --add-data "templates;templates" --add-data "static;static" desktop.py

      - name: Verify PyInstaller output
        run: dir dist\DevOpsTracker

      - name: Compile Inno Setup Installer
        run: iscc installer.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: installer_output/*.exe